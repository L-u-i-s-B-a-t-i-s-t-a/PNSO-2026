<style>
:root { --bg:#f6f8f9; --surface:#fff; --ink:#16243a; --muted:#56647a; --line:#d6dee5; --accent:#007eb5; --accent-soft:#e2f1f8; --ok:#1e7a4c; --ok-soft:#e3f4ea; --no:#b4521c; --no-soft:#fbefe5;

@media (prefers-color-scheme: dark) { :root { --bg:#0e1522; --surface:#151f31; --ink:#e6ecf3; --muted:#9aa8bb; --line:#2a3850; --accent:#55b9ea; --accent-soft:#13324a; --ok:#5fd09a; --ok-soft:#14352a; --no:#f0965f; --no-soft:#3a2619; color-scheme:dark; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 var(--body); }
.wrap { max-width:760px; margin:0 auto; padding:28px 16px 48px; }
.label { font:12px var(--mono); letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
h1 { font:700 34px/1.05 var(--display); margin:6px 0 10px; }
.lead { color:var(--muted); margin:0 0 20px; }

.card .top { display:flex; justify-content:space-between; gap:12px; margin-bottom:6px; }

<body>
<div class="wrap">
  <div class="label">Week 2 · Quiz 2 · not graded</div>
  <h1>Quiz 2</h1>
  <div id="quiz"></div>
  <footer>T. Santos, L. Batista · Ship and Ocean Systems Design 2026 · Holtrop and Mennen (1982) · Papanikolaou (2026) §2.2–2.12</footer>
</div>
<div class="score" id="score"></div>
<script>
// Quiz 2 questions. a = index of the correct option. calc = needs a calculator.
var Q = [
 {
  "t": "Length and the Froude number · L2.3a",
  "calc": true,
  "q": "The 596 TEU feeder has L = 113 m. What is its Froude number at 16 kn (1 kn = 0.5144 m/s)?",
  "o": [
   "Fn ≈ 0.48",
   "Fn ≈ 0.25",
   "Fn ≈ 0.07",
   "Fn ≈ 0.77"
  ],
  "a": 1,
  "e": "V = 16 · 0.5144 = 8.23 m/s; √(g·L) = √(9.81 · 113) = 33.3 m/s; Fn = 8.23 / 33.3 = 0.247 ≈ 0.25, as on the lecture slide (0.22 at 14 kn, 0.28 at 18 kn, 0.31 at 20 kn, on the 0.29–0.31 hump). 0.48 puts the speed in knots; 0.07 divides by L instead of √(gL); 0.77 divides by √L and forgets g."
 },
 {
  "t": "The full wave along the hull · Holtrop–Mennen",
  "calc": true,
  "q": "A ship 100 m long sails so that one full wave of her own system fits between the fore and the aft peak (wavelength λ = L). A deep-water wave has speed V = √(g λ / 2π). What speed is this (1 kn = 0.5144 m/s)?",
  "o": [
   "≈ 12.5 kn",
   "≈ 24.3 kn",
   "≈ 17.2 kn",
   "≈ 34.3 kn"
  ],
  "a": 1,
  "e": "V = √(9.81 · 100 / 2π) = √156.1 = 12.5 m/s = 24.3 kn, that is Fn = V / √(gL) = 1 / √(2π) = 0.40 (the classical hull speed, 1.34 √L with L in feet). 12.5 kn is the value in m/s read as knots; 17.2 kn is half a wave (λ = L/2); 34.3 kn is two lengths (λ = 2L). Near this speed the wave resistance rises very steeply: it is far above the economical speed of a displacement hull."
 },
 {
  "t": "Length against resistance · L2.3a",
  "calc": true,
  "q": "A slow ship (Fn ≈ 0.19) has friction at 70 % of the total resistance. It is made 10 % longer at the same displacement and speed: friction grows ×1.03 and the residuary resistance falls ×0.87. What is the new total resistance, relative to the old?",
  "o": [
   "× 1.03, friction wins",
   "× 0.90, resistance follows the length",
   "× 0.98, a saving of about 2 %",
   "× 0.87, the waves decide everything"
  ],
  "a": 2,
  "e": "RT/RT0 = 0.70 · 1.03 + 0.30 · 0.87 = 0.721 + 0.261 = 0.982. At a low Fn most of the resistance is friction, which grows with the wetted surface, so the gain from the waves is small: −1.8 % here, against −3 % for the reference ship (Fn 0.21, friction 65 %). A slow ship has little to gain from length."
 },
 {
  "t": "Length costs steel · L2.3a",
  "calc": true,
  "q": "Lengthening the reference ship by 10 % (same Δ) cuts the resistance, and so the fuel burned, by 3 %, and raises the hull steel by 15 %. The ship burns fuel worth 1.5 M€ per year and the hull steel costs 8 M€. Over 20 years of operation (no discounting), what is the net change in cost of the longer ship?",
  "o": [
   "+0.3 M€: the longer ship costs more",
   "−0.9 M€: the longer ship costs less",
   "−0.3 M€: the longer ship costs less",
   "+1.2 M€: the longer ship costs more"
  ],
  "a": 0,
  "e": "Fuel saved: 3 % · 1.5 M€ · 20 years = 0.9 M€. Steel added: 15 % · 8 M€ = 1.2 M€. Net: 1.2 − 0.9 = +0.3 M€, so the longer ship costs more over its life (the saving takes 1.2 / 0.045 = 27 years to pay the steel back). −0.9 M€ counts only the fuel; +1.2 M€ counts only the steel; −0.3 M€ has the wrong sign. The numbers are illustrative: with dearer fuel or a longer life the balance flips, which is why the designer compares building plus running cost (the objective function), for example the required freight rate."
 },
 {
  "t": "Beam and draught · L2.3a",
  "calc": true,
  "q": "Reference ship: Δ = 13,200.7 t, L = 124.8 m, C_B = 0.749, ρ = 1.025 t/m³, B/T = 2.90. What draught do these give?",
  "o": [
   "T ≈ 6.89 m",
   "T ≈ 11.74 m",
   "T ≈ 6.98 m",
   "T ≈ 47.5 m"
  ],
  "a": 0,
  "e": "∇ = 13,200.7 / 1.025 = 12,879 m³ and B·T = ∇ / (L · C_B) = 12,879 / (124.8 · 0.749) = 137.8 m². With B = 2.90 T: 2.90 T² = 137.8, so T = √47.5 = 6.89 m and B = 19.98 m. 6.98 m uses Δ in place of ∇; 11.74 m is √(B·T); 47.5 m forgets the square root."
 },
 {
  "t": "Form coefficients · L2.3a",
  "q": "What is the prismatic coefficient C_P of a hull?",
  "o": [
   "The waterplane area divided by L · B",
   "The midship section area divided by B · T",
   "The displaced volume ∇ divided by the midship section area A_M times the length L: C_P = ∇ / (A_M · L) = C_B / C_M",
   "The displaced volume ∇ divided by L · B · T"
  ],
  "a": 2,
  "e": "C_P = ∇ / (A_M · L) = C_B / C_M: it tells how the volume is spread along the length (a low C_P puts it amidships and gives fine ends, which suits a fast ship). The other fractions are C_WP (waterplane area / L · B), C_M (midship section area / B · T) and C_B (∇ / L · B · T). Example: C_B = 0.65 and C_M = 0.965 give C_P = 0.65 / 0.965 = 0.674."
 },
 {
  "t": "The six parts · Holtrop–Mennen",
  "q": "Which list gives the parts of the total resistance R_T in the Holtrop–Mennen method?",
  "o": [
   "Friction, waves, air drag, sea margin, fouling and propeller thrust",
   "Friction (with the form factor), appendages, waves, bulb, transom and the model–ship correlation allowance",
   "Friction, waves and the propeller thrust deduction only",
   "Friction, appendages, waves and the wind drag of the superstructure"
  ],
  "a": 1,
  "e": "The paper subdivides the total resistance into six terms: R_T = R_F (1 + k1) + R_APP + R_W + R_B + R_TR + R_A. R_F is the frictional resistance by the ITTC-1957 formula and (1 + k1) the form factor of the hull; R_APP the resistance of the appendages; R_W the wave-making and wave-breaking resistance; R_B the additional pressure resistance of a bulbous bow near the surface; R_TR the additional pressure resistance of the immersed transom; R_A the model–ship correlation resistance. The margins (sea, design, service) and the air or wind drag are not among them: they are added afterwards. The thrust deduction t belongs to the propulsion chain, not to the resistance."
 },
 {
  "t": "Friction · Holtrop–Mennen",
  "q": "How is the friction resistance computed in the method?",
  "o": [
   "From the wave-making coefficient of the hull, with no Reynolds number",
   "From C_F = 0.075 / (log10 Re − 2)² on the wetted surface, with no form factor, because the hull is a flat plate",
   "From the ITTC-1957 line, C_F = 0.075 / (log10 Re − 2)², on the wetted surface, multiplied by the form factor (1 + k1)",
   "From the entrance angle iE and the bulb area A_BT"
  ],
  "a": 2,
  "e": "Friction follows the flat-plate line (ITTC-1957), which depends on the Reynolds number Re = V L / ν, times the wetted surface S. The hull is not a flat plate: its curvature raises the speed along the hull and the pressure resistance, so the friction is multiplied by the form factor (1 + k1). The entrance angle and the bulb belong to the wave resistance."
 },
 {
  "t": "Speed and power where friction dominates · Holtrop–Mennen",
  "calc": true,
  "q": "A 100 m ship sails in the low Froude regime (Fn < 0.2), where the resistance is almost all friction. The friction coefficient C_F = 0.075 / (log10 Re − 2)² is 0.001703 at 10 kn and 0.001663 at 12 kn. How do the friction resistance R_F and the effective power P_E vary with the speed V?",
  "o": [
   "R_F ∝ V² and P_E ∝ V³ exactly, because C_F is constant",
   "R_F ∝ V^3 and P_E ∝ V^4",
   "R_F ∝ V^1.9 and P_E ∝ V^2.9: a little below the square and the cube",
   "R_F ∝ V^5 and P_E ∝ V^6, as near a wave hump"
  ],
  "a": 2,
  "e": "R_F = ½ρ S C_F V². C_F is not constant: it falls slowly as Re = V L / ν grows. From 10 to 12 kn the speed grows by 1.2 and C_F by 0.001663 / 0.001703 = 0.977, so the exponent of C_F is ln 0.977 / ln 1.2 = −0.13. Then R_F ∝ V^(2 − 0.13) = V^1.87 and P_E = R_F · V ∝ V^2.87. The Admiralty law rounds this to the cube, which is fair while friction is most of the resistance (Fn below about 0.2). The exponent 5 or more belongs to the wave resistance near a hump, not to friction."
 },
 {
  "t": "The three parts of the wave resistance · Holtrop–Mennen",
  "q": "The wave resistance is R_W = c1 c2 c5 ∇ ρ g · exp{ m1 Fn^−0.9 + m2 cos(λ Fn^−2) }. Which statement describes its three parts?",
  "o": [
   "The factor c1 c2 c5 ∇ρg gives the humps and hollows; the term m1 Fn^−0.9 gives the level; the term m2 cos(λ Fn^−2) gives the smooth rise with speed",
   "The factor c1 c2 c5 ∇ρg is the wave resistance of the bulb; m1 Fn^−0.9 is that of the transom; m2 cos(λ Fn^−2) is that of the bow",
   "The factor c1 c2 c5 ∇ρg gives the level (volume, entrance, bulb and transom); the term m1 Fn^−0.9 gives the smooth rise with speed; the term m2 cos(λ Fn^−2) gives the humps and hollows",
   "The three parts are friction, form and correlation; the Froude number only scales them"
  ],
  "a": 2,
  "e": "Read the formula from the outside in. (1) c1 c2 c5 ∇ρg is the level: ∇ρg is the weight of the displaced water, c1 carries the hull shape and the entrance angle iE, c2 the bulb and c5 the transom (paper ship: c1 = 1.40, c2 = 0.76, c5 = 0.96). (2) m1 Fn^−0.9 is the smooth trend: m1 is negative (−2.13 here), so exp(m1 Fn^−0.9) grows with speed. (3) m2 cos(λ Fn^−2) is the oscillation of the waves of bow and stern, which reinforce or cancel each other: λ = 1.446 C_P − 0.03 L/B = 0.65 and m2 is negative, so a hump is where cos = −1, at λ/Fn² = 3π, that is Fn = 0.263 (16.2 kn at 102.5 m, 22.9 kn at 205 m), and a hollow at λ/Fn² = 2π, Fn = 0.322. The 1984 revision of Holtrop keeps this form for Fn < 0.4 and adds other formulas for Fn > 0.55 and an interpolation in between."
 },
 {
  "t": "Entrance angle · Holtrop–Mennen",
  "q": "The entrance angle iE is an input of the method. Which resistance does it change?",
  "o": [
   "Only the friction resistance, through the wetted surface",
   "Only the wave resistance R_W, through the coefficient c1: a larger angle gives more wave resistance",
   "The transom resistance R_TR",
   "The bulb resistance R_B and the friction in equal parts"
  ],
  "a": 1,
  "e": "iE is half the angle of the design waterline at the bow, measured from the centre plane, leaving out the local rounding of the stem. It enters R_W through c1 ∝ (90 − iE)^−1.376 (and the other factors), and nothing else. For the paper ship +1° gives about +1.8 % in R_W; 8° gives −6.8 %, 16° gives +7.4 % and 24° gives +25.7 %. With lines it is measured; without lines the method has a formula (12.1° for this ship)."
 },
 {
  "t": "The bulb · Holtrop–Mennen",
  "calc": true,
  "q": "For the paper ship the bulb gives c2 = 0.759, the factor that multiplies the wave resistance. What does the bulb do?",
  "o": [
   "R_W rises by about 24 %",
   "R_W falls by about 76 %",
   "R_W does not change: the bulb only adds the pressure term R_B",
   "R_W falls by about 24 %, and the wetted surface grows a little"
  ],
  "a": 3,
  "e": "R_W with the bulb = c2 · R_W without it: 0.759 means 1 − 0.759 = 24 % less (not 76 %). The price is a larger wetted surface (2.38 · A_BT / C_B, here +83 m²) and a small extra pressure term R_B, which matters only when the bulb is near the surface (0.05 kN at A_BT = 20 m², but 6.7 kN at 40 m²). The saving is worth it at higher Froude numbers (6–15 % of the power for Fn ≥ 0.27)."
 },
 {
  "t": "The transom · Holtrop–Mennen",
  "q": "The transom resistance of the paper ship is 34 kN at 15 kn (7 % of R_T) and zero from 23 kn. Why?",
  "o": [
   "Because the transom area A_T grows with the speed",
   "Because the bulb takes over the transom resistance above 23 kn",
   "With c6 = 0.2 (1 − 0.2 Fn_T), the term vanishes for Fn_T ≥ 5: the transom is then dry and the flow leaves it cleanly",
   "Because the method is not valid above 23 kn"
  ],
  "a": 2,
  "e": "R_TR = ½ ρ V² A_T c6, with Fn_T = V / √(2 g A_T / (B + B C_WP)). At low speed the transom is wet and drags water behind it; as Fn_T grows c6 falls and reaches zero at Fn_T = 5, here at 23 kn. A_T is the area of the transom below the still waterline, with the ship at rest, so it is a fixed input (here 16 m²). It also lowers R_W through c5 = 1 − 0.8 A_T / (B T C_M)."
 },
 {
  "t": "Total resistance and effective power · L2.4",
  "q": "What is the total resistance R_T of a ship, and what do you get by multiplying R_T by the ship speed V?",
  "o": [
   "R_T is the friction resistance only; R_T · V is the brake power at the engine",
   "R_T is the force that opposes the motion of the hull through the water at speed V (friction, waves, form, appendages and air); R_T · V is the effective power P_E, the power needed to tow the ship",
   "R_T is the thrust of the propeller; R_T · V is the delivered power P_D",
   "R_T is the wave resistance only; R_T · V is the installed power SMCR"
  ],
  "a": 1,
  "e": "R_T is the whole force the water (and the air) exerts against the ship moving at V. Force times speed is power: P_E = R_T · V, the effective (towing) power, before any loss in the propulsion chain. Reference ship at 14 kn (7.20 m/s): R_T = 268.3 kN gives P_E = 268.3 · 7.20 = 1,932 kW. Then P_D = P_E / η_D, P_B = P_D / η_S and SMCR = P_B · 1.15 / 0.90 (3,502 kW). The thrust T is a different force, and friction and waves are only parts of R_T."
 },
 {
  "t": "From R_T to the effective power · Holtrop–Mennen",
  "calc": true,
  "q": "Paper ship, 25 kn (1 kn = 0.5144 m/s): R_T = 1,792 kN. What is the effective power P_E = R_T · V?",
  "o": [
   "P_E ≈ 23,050 kW",
   "P_E ≈ 44,800 kW",
   "P_E ≈ 72 kW",
   "P_E ≈ 11,520 kW"
  ],
  "a": 0,
  "e": "V = 25 · 0.5144 = 12.86 m/s and P_E = 1,792 kN · 12.86 m/s = 23,047 kW (kN · m/s = kW). 44,800 kW multiplies by 25, the speed in knots; 72 kW divides R_T by V; 11,520 kW takes half of the answer. The effective power is the power needed to tow the ship, before any loss in the propulsion chain."
 },
 {
  "t": "What the power does not include · Holtrop–Mennen",
  "calc": true,
  "q": "For the paper ship the chain gives P_S ≈ 32,600 kW at 25 kn, in calm water and with a clean hull. With a sea margin of 15 % and the engine used at 90 % of its MCR, what installed power (SMCR) does this ask for?",
  "o": [
   "≈ 37,500 kW",
   "≈ 33,700 kW",
   "≈ 29,300 kW",
   "≈ 41,700 kW"
  ],
  "a": 3,
  "e": "SMCR = P_S · 1.15 / 0.90 = 32,600 · 1.278 = 41,656 ≈ 41,700 kW. The sea margin raises the power (× 1.15) and the engine is used at 90 % of MCR, so the margin is divided by 0.90. 37,500 kW forgets the 0.90; 33,700 kW multiplies by 0.90 instead of dividing; 29,300 kW divides the margin and the load wrongly. The method gives a lower bound: the margins and the air drag are added afterwards."
 },
 {
  "t": "The Admiralty constant · Reading 2.3",
  "calc": true,
  "q": "The parent is the reference ship: Δ = 13,200.7 t, P = 3,500 kW at V = 14 kn. What is its Admiralty constant C = Δ^(2/3) · V³ / P (Δ in t, V in kn, P in kW)?",
  "o": [
   "C ≈ 59.6",
   "C ≈ 31.3",
   "C ≈ 18.5",
   "C ≈ 438"
  ],
  "a": 3,
  "e": "Δ^(2/3) = 13,200.7^(2/3) = 558.6 and V³ = 2,744, so C = 558.6 · 2,744 / 3,500 = 438. The check is the typical range, 400–600. 59.6 puts V in m/s; 31.3 uses V² in place of V³; 18.5 takes Δ^(1/3) in place of Δ^(2/3)."
 },
 {
  "t": "Sister ship · Reading 2.3",
  "calc": true,
  "q": "A sister ship of the same hull form floats 5 % heavier than the reference ship (Δ = 13,860.7 t). What power does she need at 14.5 kn, if the parent needs 3,500 kW at 14 kn?",
  "o": [
   "About 4,083 kW",
   "About 3,889 kW",
   "About 4,501 kW",
   "About 4,017 kW"
  ],
  "a": 3,
  "e": "C cancels: P = 3,500 · (1.05)^(2/3) · (14.5 / 14)³ = 3,500 · 1.033 · 1.111 = 4,017 kW (Holtrop–Mennen: 4,065 kW, 1 % apart). 4,083 kW uses Δ to the power 1 (+5 % in place of +3.3 %); 3,889 kW forgets the displacement; 4,501 kW uses Δ³. Displacement enters with the 2/3 power, speed with the cube: speed is the dear requirement."
 }
];

(function () {
  var root = document.getElementById("quiz"), done = 0, right = 0;
  function upd() { document.getElementById("score").textContent = "Answered " + done + " of " + Q.length + " · correct " + right; }
  Q.forEach(function (x, i) {
    var c = document.createElement("div"); c.className = "card";
    c.innerHTML = '<div class="top"><span class="label">' + (i + 1) + " · " + x.t + "</span>" + (x.calc ? '<span class="calc">calculator</span>' : "") + "</div><h2></h2>";
    c.querySelector("h2").textContent = x.q;
    var opts = [];
    x.o.forEach(function (t, j) {
      var l = document.createElement("label"); l.className = "opt";
      var r = document.createElement("input"); r.type = "radio"; r.name = "q" + i; r.value = j;
      var s = document.createElement("span"); s.textContent = String.fromCharCode(65 + j) + ". " + t;
      l.appendChild(r); l.appendChild(s); c.appendChild(l); opts.push(l);
    });
    var b = document.createElement("button"); b.textContent = "Check"; c.appendChild(b);
    var w = document.createElement("div"); w.className = "why"; c.appendChild(w);
    b.onclick = function () {
      var sel = c.querySelector("input:checked"); if (!sel) return;
      var k = +sel.value, ok = k === x.a;
      opts[x.a].classList.add("right"); if (!ok) opts[k].classList.add("wrong");
      c.querySelectorAll("input").forEach(function (r) { r.disabled = true; });
      b.disabled = true; done++; if (ok) right++;
      w.innerHTML = "<b>" + (ok ? "Right." : "Not quite: the answer is " + String.fromCharCode(65 + x.a) + ".") + "</b>";
      w.appendChild(document.createTextNode(x.e)); w.style.display = "block"; upd();
    };
    root.appendChild(c);
  });
  upd();
})();
</script>
