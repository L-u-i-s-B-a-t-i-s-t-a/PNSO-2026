<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Container Ship Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f2f6f9;--card:#fcfdfe;--ink:#1e2b34;--mute:#5b6b76;--line:#d5dee5;--blue:#0079ad;--blue2:#009de0;--orange:#d9692a;--orange2:#b4521c;--green:#2e9e5b;--red:#d63a3a;--water:#cfe6f3;--water2:#9fcbe2;--hull:#34495a;--house:#e8eef2}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10181e;--card:#17222a;--ink:#e6edf1;--mute:#9db0bc;--line:#2c3b46;--blue:#4cb8ea;--blue2:#4cb8ea;--orange:#f0894a;--orange2:#f0894a;--green:#4cc27f;--red:#f0605f;--water:#1b3342;--water2:#27506a;--hull:#8aa3b4;--house:#2a3944}}
:root[data-theme=dark]{--bg:#10181e;--card:#17222a;--ink:#e6edf1;--mute:#9db0bc;--line:#2c3b46;--blue:#4cb8ea;--blue2:#4cb8ea;--orange:#f0894a;--orange2:#f0894a;--green:#4cc27f;--red:#f0605f;--water:#1b3342;--water2:#27506a;--hull:#8aa3b4;--house:#2a3944}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,Arial,sans-serif}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding:8px 12px;max-width:2000px;margin:0 auto}
.top{display:flex;align-items:baseline;gap:14px;min-width:0}
.top .no{font:600 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--blue);padding:4px 8px;border-radius:5px;white-space:nowrap;align-self:center}
.top .chap{font:600 clamp(11px,.9vw,14px)/1.2 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.top h1{margin:0;font-size:clamp(17px,1.9vw,30px);line-height:1.15;flex:1;min-width:0}
.top button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer;align-self:center}
.mid{display:grid;grid-template-columns:minmax(0,1fr) clamp(290px,29vw,460px);gap:12px;min-height:0}
.board{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.side{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto;min-height:0;font-size:clamp(14px,1.15vw,19px);line-height:1.5}
.why{margin:0 0 10px;font-weight:600;color:var(--orange2);line-height:1.4}
.why:empty{display:none}
.pts{margin:0 0 10px;padding-left:1.1em}
.pts li{margin:0 0 6px}
.eqs{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px}
.eqs .eq{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;overflow-x:auto;font-size:1.05em}
.eqs .eq svg{display:block;margin:0 auto}
.sub:empty{display:none}
.card{border:2px solid var(--blue);background:var(--bg);border-radius:8px;padding:10px 12px;font-size:.95em;margin:8px 0}
.card input[type=range]{width:100%}
.card button{font:inherit;font-size:.9em;border:1px solid var(--blue);background:transparent;color:var(--blue);border-radius:6px;padding:3px 9px;cursor:pointer;margin:2px 4px 2px 0}
.card .ans{display:none;margin:4px 0 8px}
.card .ans.on{display:block}
details{margin:8px 0 0;font-size:.88em}
details summary{cursor:pointer;color:var(--blue);font-weight:600}
details p{margin:6px 0}
.src{font-size:.78em;line-height:1.4;color:var(--mute);margin:8px 0 0}
.ctl{display:flex;align-items:center;gap:8px;min-width:0}
.ctl button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer;min-width:38px}
.ctl input[type=range]{flex:1;min-width:60px}
.ctl .tm{font:12px ui-monospace,monospace;color:var(--mute);white-space:nowrap}
.dots{display:flex;gap:5px}
.dots button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--mute);font:600 11px ui-monospace,monospace;cursor:pointer;padding:0;min-width:0}
.dots button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.dots button.done{border-color:var(--blue);color:var(--blue)}
@media (max-width:820px){
 .app{height:auto;min-height:100dvh;grid-template-rows:auto auto auto}
 .mid{grid-template-columns:1fr}.board{height:auto;aspect-ratio:10/6}
 .top{flex-wrap:wrap;gap:6px}.top .chap{display:none}.ctl{flex-wrap:wrap}.dots{width:100%;order:5;flex-wrap:wrap}.side{overflow:visible}
}
</style>
</head>

const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const seg=(p,a,b)=>clamp((p-a)/(b-a));
const fmt=n=>Math.round(n).toLocaleString('en-US');

function readColours(){
  const s=getComputedStyle(document.documentElement), g=n=>s.getPropertyValue(n).trim();
  C={bg:g('--bg'),card:g('--card'),ink:g('--ink'),mute:g('--mute'),line:g('--line'),blue:g('--blue'),blue2:g('--blue2'),
     orange:g('--orange'),orange2:g('--orange2'),green:g('--green'),red:g('--red'),water:g('--water'),water2:g('--water2'),hull:g('--hull'),house:g('--house')};

function txt(s,x,y,o={}){
  cx.save();cx.font=(o.weight||400)+' '+(o.size||15)*TS*K+'px '+(o.mono?'ui-monospace,Menlo,monospace':'"IBM Plex Sans",system-ui,Arial,sans-serif');
  cx.fillStyle=o.color||C.ink;cx.textAlign=o.align||'left';cx.textBaseline=o.base||'alphabetic';
  if(o.alpha!=null)cx.globalAlpha=o.alpha;
  cx.fillText(s,x*K,y*K);cx.restore();
}
function ln(x1,y1,x2,y2,o={}){
  cx.save();cx.strokeStyle=o.color||C.ink;cx.lineWidth=(o.w||1.5)*K;if(o.dash)cx.setLineDash(o.dash.map(d=>d*K));
  if(o.alpha!=null)cx.globalAlpha=o.alpha;
  cx.beginPath();cx.moveTo(x1*K,y1*K);cx.lineTo(x2*K,y2*K);cx.stroke();cx.restore();
}
function rect(x,y,w,h,o={}){
  cx.save();if(o.alpha!=null)cx.globalAlpha=o.alpha;
  if(o.fill){cx.fillStyle=o.fill;cx.fillRect(x*K,y*K,w*K,h*K)}
  if(o.stroke){cx.strokeStyle=o.stroke;cx.lineWidth=(o.w||1.5)*K;if(o.dash)cx.setLineDash(o.dash.map(d=>d*K));cx.strokeRect(x*K,y*K,w*K,h*K)}
  cx.restore();
}
function poly(pts,o={}){
  cx.save();if(o.alpha!=null)cx.globalAlpha=o.alpha;cx.beginPath();
  pts.forEach((p,i)=>i?cx.lineTo(p[0]*K,p[1]*K):cx.moveTo(p[0]*K,p[1]*K));
  if(o.close!==false)cx.closePath();
  if(o.fill){cx.fillStyle=o.fill;cx.fill()}
  if(o.stroke){cx.strokeStyle=o.stroke;cx.lineWidth=(o.w||1.5)*K;if(o.dash)cx.setLineDash(o.dash.map(d=>d*K));cx.stroke()}
  cx.restore();
}
function dot(x,y,r,o={}){
  cx.save();if(o.alpha!=null)cx.globalAlpha=o.alpha;cx.beginPath();cx.arc(x*K,y*K,r*K,0,6.2832);
  if(o.fill){cx.fillStyle=o.fill;cx.fill()}if(o.stroke){cx.strokeStyle=o.stroke;cx.lineWidth=(o.w||1.5)*K;cx.stroke()}cx.restore();
}
function arrow(x1,y1,x2,y2,o={}){
  ln(x1,y1,x2,y2,o);const a=Math.atan2(y2-y1,x2-x1),s=o.head||8;
  poly([[x2,y2],[x2-s*Math.cos(a-0.4),y2-s*Math.sin(a-0.4)],[x2-s*Math.cos(a+0.4),y2-s*Math.sin(a+0.4)]],{fill:o.color||C.ink,alpha:o.alpha});
}
// legend: items [colour, text, {dash,box,dot}] ; shown from the first frame
function legend(x,y,items,o={}){
  const fs=o.size||13, rowh=o.row||19;
  items.forEach((it,i)=>{
    const yy=y+i*rowh;
    if(it[2]&&it[2].box)rect(x,yy-9,16,10,{fill:it[0],alpha:it[2].alpha});

// ---- timeline engine ----
let SC=[], START=[], TOTAL=0, state={t:0,playing:false,last:0}, shown=-1, MAN=null;
function setup(scenes){
  SC=scenes;let a=0;START=SC.map(s=>{const st=a;a+=s.d;return st});TOTAL=a;
  $('dots').innerHTML=SC.map((s,i)=>'<button data-k="'+i+'" aria-label="Scene '+(i+1)+'">'+(i+1)+'</button>').join('');
  $('dots').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(+b.dataset.k)});
  const setPlay=v=>{state.playing=v;state.last=performance.now();$('play').innerHTML=v?'&#10074;&#10074;':'&#9654;'};window.setPlay=setPlay;
  $('play').onclick=()=>{if(state.t>=TOTAL-0.05)state.t=0;MAN=null;setPlay(!state.playing)};
  $('prev').onclick=()=>go(Math.max(0,cur()-1));
  $('next').onclick=()=>go(Math.min(SC.length-1,cur()+1));
  $('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(_){}};
  addEventListener('keydown',e=>{if(/INPUT|BUTTON/.test(e.target.tagName)&&e.key===' ')return;if(e.key===' '){e.preventDefault();$('play').click()}else if(e.key==='ArrowRight'||e.key==='PageDown')$('next').click();else if(e.key==='ArrowLeft'||e.key==='PageUp')$('prev').click();else if(e.key==='f'||e.key==='F')$('fs').click()});
  $('scrub').oninput=e=>{state.t=+e.target.value/1000*TOTAL;MAN=null;render()};
  $('sub').addEventListener('input',e=>{if(SC[cur()].onInput){SC[cur()].onInput(e);setPlay(false);render()}});
  $('sub').addEventListener('click',e=>{if(SC[cur()].onClick){SC[cur()].onClick(e)}});
  addEventListener('resize',()=>{fit();render()});
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readColours();render()});
  fit();setPlay(true);render();requestAnimationFrame(tick);
}
function cur(){let k=0;for(let i=0;i<SC.length;i++)if(state.t>=START[i])k=i;return k}
function go(k){state.t=START[k]+0.01;MAN=null;setPlay(true);render()}
function fit(){
  const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);
  cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);
  K=Math.min(cv.width/1000,cv.height/600);OX=(cv.width-1000*K)/2;OY=(cv.height-600*K)/2;TS=r.width<640?1.3:1;readColours();
}
function caption(k){
  const s=SC[k];
  $('no').textContent=(k+1)+' / '+SC.length;$('chap').textContent=s.chap;$('stitle').textContent=s.title;
  $('swhy').textContent=s.why||'';
  $('spts').innerHTML=(s.pts||[]).map(t=>'<li>'+t+'</li>').join('');
  $('seqs').innerHTML=(s.eq||[]).map(id=>'<div class="eq">'+EQ[id]+'</div>').join('');
  $('more').style.display=(s.more&&s.more.length)?'':'none';$('more').open=false;
  $('mbody').innerHTML=(s.more||[]).map(t=>'<p>'+t+'</p>').join('');
  $('ssrc').innerHTML=s.src?('Sources: '+s.src):'';
  $('side').scrollTop=0;shown=k;
}
function render(){
  const k=cur();if(k!==shown){caption(k);subkey=null;$('sub').innerHTML=''}
  const p=clamp((state.t-START[k])/SC[k].d);
  cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);cx.fillStyle=C.card;cx.fillRect(0,0,cv.width,cv.height);
  cx.translate(OX,OY);
  SC[k].draw(p,state.t);
  // sub-panel
  const sp=SC[k].sub?SC[k].sub(p):null,key=sp?sp.key:'';
  if(key!==subkey){$('sub').innerHTML=sp?sp.html:'';subkey=key}
  if(SC[k].sync)SC[k].sync(p);
  [...$('dots').children].forEach((b,i)=>{b.className=i===k?'on':(i<k?'done':'')});
  $('scrub').value=Math.round(state.t/TOTAL*1000);
  const m=Math.floor(state.t/60),s2=Math.floor(state.t%60);$('tm').textContent=m+':'+String(s2).padStart(2,'0')+' / '+Math.floor(TOTAL/60)+':'+String(Math.floor(TOTAL%60)).padStart(2,'0');
}
let subkey='';
function tick(now){
  if(state.playing){
    const dt=Math.min(0.1,(now-state.last)/1000);state.last=now;state.t+=dt;
    if(state.t>=TOTAL){state.t=TOTAL-0.001;setPlay(false)}
    render();
  }else state.last=now;
  requestAnimationFrame(tick);
}

// ---------- ship drawing (side view, bow to the right) ----------
function waveY(x,t,a){return Math.sin(x*0.03+t*1.6)*a+Math.sin(x*0.011-t*0.9)*a*0.7}
function ring(x,y,w,h,a){if(a>0.01)rect(x,y,w,h,{stroke:C.orange,w:2.5,dash:[6,4],alpha:a})}
function boxship(x0,yw,L,o={}){
  const u=L/400,T=17*u,Dp=22.92*u,yb=yw+T,yd=yb-Dp,fill=o.fill==null?1:o.fill,ta=o.tiers||10,hi=o.hi||{},t=o.t||0;
  const cw=12.19*u,th=2.59*u,nb=Math.floor((Dp-3*u)/th);
  // below-deck holds
  const holds=[[0.07,0.395],[0.585,0.915]];
  holds.forEach(([a,b],hi_)=>{
    const n=Math.floor((b-a)*L/cw);
    for(let c=0;c<n;c++)for(let r=0;r<nb;r++){
      const k=(c*7+r*13+hi_*5)%8,x=x0+a*L+c*cw;
      rect(x+0.4,yb-3*u-(r+1)*th,cw-0.8,th-0.8,{fill:BOX[k],alpha:0.55*Math.min(1,fill*3)});
    }
  });
  // hull
  poly([[x0,yd-0.4*u],[x0+0.012*L,yb-1*u],[x0+0.05*L,yb],[x0+0.9*L,yb],[x0+0.97*L,yb-0.5*Dp],[x0+L,yd-1.5*u]],{stroke:C.hull,w:2.2,fill:'rgba(52,73,90,0.10)'});
  // engine room and shaft
  rect(x0+0.40*L,yd+0.15*Dp,0.185*L,0.85*Dp,{fill:C.house,alpha:0.9,stroke:C.hull,w:1});
  rect(x0+0.445*L,yb-0.78*Dp,0.09*L,0.55*Dp,{fill:C.hull,alpha:0.55});
  ln(x0+0.445*L,yb-0.18*Dp,x0+0.006*L,yb-0.30*T,{color:C.hull,w:2.2});
  // propeller and rudder
  poly([[x0+0.004*L,yb-0.30*T-5.5*u],[x0+0.012*L,yb-0.30*T],[x0+0.004*L,yb-0.30*T+5.5*u],[x0-0.003*L,yb-0.30*T]],{fill:C.hull});
  rect(x0-0.012*L,yb-0.62*T,0.005*L,0.62*T,{fill:C.hull});
  // bulb
  cx.save();cx.fillStyle=C.hull;cx.globalAlpha=0.35;cx.beginPath();cx.ellipse((x0+0.985*L)*K,(yb-0.28*T)*K,0.024*L*K,0.07*T*K,0,0,6.2832);cx.fill();cx.restore();
  // deck stacks
  const stacks=[[0.06,0.535],[0.645,0.935]];
  stacks.forEach(([a,b],s_)=>{
    const n=Math.floor((b-a)*L/cw);
    for(let c=0;c<n;c++){
      const prog=clamp(fill*1.35-0.35*c/n);
      const tiers=Math.floor(prog*ta+1e-6);
      for(let r=0;r<tiers;r++){
        const k=(c*5+r*11+s_*3)%8,x=x0+a*L+c*cw;
        rect(x+0.4,yd-(r+1)*th*1.12,cw-0.8,th*1.12-0.8,{fill:BOX[k],alpha:0.92});
      }
    }
  });
  // deckhouse and funnel
  const hx=x0+0.585*L,hh=30*u;
  rect(hx,yd-hh,0.045*L,hh,{fill:C.house,stroke:C.hull,w:1.2});
  for(let i=1;i<7;i++)ln(hx+1,yd-hh+i*hh/7,hx+0.045*L-1,yd-hh+i*hh/7,{color:C.hull,w:0.8,alpha:0.5});
  rect(hx-0.034*L,yd-36*u,0.03*L,36*u,{fill:C.orange,alpha:0.85});
  // water
  cx.save();cx.beginPath();cx.moveTo((x0-60)*K,(yw+90)*K);
  for(let x=x0-60;x<=x0+L+60;x+=6)cx.lineTo(x*K,(yw+waveY(x,t,1.6))*K);
  cx.lineTo((x0+L+60)*K,(yw+90)*K);cx.closePath();cx.fillStyle=C.water;cx.globalAlpha=0.62;cx.fill();cx.restore();
  cx.save();cx.beginPath();for(let x=x0-60;x<=x0+L+60;x+=6){const y=yw+waveY(x,t,1.6);x===x0-60?cx.moveTo(x*K,y*K):cx.lineTo(x*K,y*K)}

  // highlights
  ring(x0+0.935*L,yb-0.55*Dp,0.075*L,0.6*Dp,hi.bulb||0);
  ring(x0+0.065*L,yd+0.02*Dp,0.335*L,0.98*Dp,hi.holds||0);
  ring(x0+0.06*L,yd-ta*th*1.12-3,0.475*L,ta*th*1.12+3,hi.deck||0);
  ring(hx-0.04*L,yd-40*u,0.09*L,40*u,hi.house||0);
  ring(x0-0.02*L,yd+0.1*Dp,0.62*L,1.0*Dp,hi.engine||0);
  if(hi.torsion>0.01){
    const a=hi.torsion;

    });
  }
  return {yd,yb,u,th,Dp,T,hx};
}
